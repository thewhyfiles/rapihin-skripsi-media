<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rapihin Skripsi - Cover Reels</title>
<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:700;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:800;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:600;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:800;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:700;src:url(fonts/ibm-plex-mono-latin-700-normal.woff2) format("woff2")}
:root{--green:#0E5C4E;--stab:#FFE45C;--ink:#12201D;--red:#C23B22;--blue:#3B82B0;--bg:#F6F8F5}
*{box-sizing:border-box}
html,body{margin:0;background:#888}
/* Cover Reels 1080x1920. Zona aman grid profil (3:4): y 240-1680. Semua elemen penting di dalamnya. */
.cover{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(18,32,29,.07) 2px,transparent 2.5px);background-size:60px 60px;background-position:30px 30px}
.brand{position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center;align-items:center;gap:16px;font-family:"Bricolage Grotesque";font-weight:800;font-size:46px;color:var(--green);letter-spacing:-.005em}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--stab);box-shadow:0 0 0 4px var(--green) inset}
.main{position:absolute;left:80px;right:80px;top:410px;display:flex;flex-direction:column;align-items:center;gap:48px;text-align:center}
.chip{background:var(--ink);color:var(--bg);font-weight:800;font-size:40px;letter-spacing:.08em;padding:14px 36px;border-radius:44px}
h1{margin:0;font-family:"Bricolage Grotesque";font-weight:800;font-size:122px;line-height:1.03;letter-spacing:-.02em}
mark{white-space:nowrap;background:var(--stab);color:var(--ink);padding:0 .12em;border-radius:.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.art{display:flex;justify-content:center}
.foot{position:absolute;left:120px;right:120px;top:1556px;text-align:center;font-weight:600;font-size:36px;line-height:1.3;color:var(--ink);opacity:.8}
</style>
</head>
<body>
<section class="cover" id="cover">
  <div class="dots"></div>
  <div class="brand"><i></i>Rapihin Skripsi</div>
  <div class="main">
    <span class="chip">TIPS FORMAT</span>
    <h1>Kenapa<br><mark>margin kiri</mark><br>skripsi lebih<br>lebar?</h1>
    <div class="art">
      <svg width="520" height="500" viewBox="0 0 520 500" aria-hidden="true">
        <rect x="150" y="12" width="300" height="420" rx="6" fill="#12201D" opacity=".10"/>
        <rect x="140" y="2" width="300" height="420" rx="6" fill="#fff" stroke="#12201D" stroke-opacity=".14" stroke-width="2"/>
        <rect x="140" y="2" width="60" height="420" fill="#FFE45C"/>
        <g fill="#12201D">
          <rect x="226" y="40" width="130" height="12" rx="6"/>
          <rect x="226" y="80" width="190" height="8" rx="4"/><rect x="226" y="104" width="204" height="8" rx="4"/>
          <rect x="226" y="128" width="196" height="8" rx="4"/><rect x="226" y="152" width="120" height="8" rx="4"/>
          <rect x="226" y="196" width="200" height="8" rx="4"/><rect x="226" y="220" width="190" height="8" rx="4"/>
          <rect x="226" y="244" width="204" height="8" rx="4"/><rect x="226" y="268" width="198" height="8" rx="4"/>
          <rect x="226" y="292" width="110" height="8" rx="4"/><rect x="226" y="336" width="204" height="8" rx="4"/>
          <rect x="226" y="360" width="150" height="8" rx="4"/>
        </g>
        <g stroke="#3B82B0" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M20 212 H140 M140 190 V234"/><path d="M20 190 V234"/>
        </g>
        <rect x="14" y="250" width="116" height="56" rx="28" fill="#3B82B0"/>
        <text x="72" y="289" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="34" fill="#fff">4 cm</text>
      </svg>
    </div>
  </div>
  <div class="foot">Contoh umum.<br>Ukuran akhir ikut buku pedoman kampus.</div>
</section>
</body>
</html>
